name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install package (editable)
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx
          pip install -e .

      - name: Run tests
        run: |
          pytest -q

      - name: Prepare pipeline output directory
        run: |
          mkdir -p outputs/local_ci

      - name: Smoke run one-shot pipeline (no report)
        run: |
          neurotrace pipeline --input tests/fixtures/seed/canonical_export_snippet.json --db outputs/local_ci/smoke.db --no-report


